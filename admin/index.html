<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Edit Konten</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen">

<!-- LOGIN -->
<main id="login" class="min-h-screen flex items-center justify-center px-4">
  <form id="loginForm" class="w-full max-w-sm bg-white p-8 rounded-2xl shadow space-y-4">
    <h1 class="text-2xl font-bold text-slate-900">Login Admin</h1>
    <div><label for="u" class="block text-sm font-medium mb-1">Username</label>
      <input id="u" required autocomplete="username" class="w-full rounded-lg border border-slate-300 px-3 py-2"></div>
    <div><label for="p" class="block text-sm font-medium mb-1">Password</label>
      <input id="p" type="password" required autocomplete="current-password" class="w-full rounded-lg border border-slate-300 px-3 py-2"></div>
    <p id="loginErr" class="text-sm text-red-600" role="alert"></p>
    <button class="w-full py-2.5 rounded-full bg-emerald-600 text-white font-semibold hover:bg-emerald-700">Masuk</button>
  </form>
</main>

<!-- EDITOR -->
<div id="editor" class="hidden">
  <header class="sticky top-0 z-10 bg-white border-b px-4 py-3 flex items-center justify-between gap-3">
    <strong class="text-slate-900">Edit Konten Website</strong>
    <div class="flex items-center gap-3">
      <span id="status" class="text-sm" role="status"></span>
      <button id="save" class="px-5 py-2 rounded-full bg-emerald-600 text-white font-semibold hover:bg-emerald-700">Simpan</button>
      <button id="logout" class="text-sm text-slate-500 hover:text-slate-800">Keluar</button>
    </div>
  </header>
  <main id="form" class="max-w-3xl mx-auto p-4 space-y-4"></main>
</div>

<script src="admin.js"></script>
</body>
</html>
